<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>硬件监控 - 三栏</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(160deg, #f0f4ff 0%, #faf5ff 50%, #f0fdf4 100%);
    min-height: 100vh; -webkit-font-smoothing: antialiased;
    color: #1d1d1f; padding: 32px;
  }
  .section { margin-bottom: 48px; }
  .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; color: #007AFF; margin-bottom: 4px; }
  .section-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; letter-spacing: -0.02em; }
  .section-desc { font-size: 13px; color: #86868b; margin-bottom: 20px; }

  .glass {
    background: rgba(255,255,255,0.5); backdrop-filter: blur(20px);
    border: 0.5px solid rgba(255,255,255,0.6); border-radius: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }

  .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .status-dot.online { background: #34C759; box-shadow: 0 0 6px rgba(52,199,89,0.5); }

  .vote { display: flex; gap: 6px; margin-top: 16px; }
  .vb { padding: 5px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid rgba(0,0,0,0.08); background: #fff; transition: all 0.15s; }
  .vb:hover { background: #f5f5f7; }
  .vb.lk { background: rgba(0,122,255,0.08); color: #007AFF; border-color: rgba(0,122,255,0.2); }
  .vb.nk { background: rgba(255,59,48,0.06); color: #FF3B30; border-color: rgba(255,59,48,0.15); }

  /* ===== 三栏布局 ===== */
  .hw3-grid {
    display: grid;
    grid-template-columns: 180px 1fr 180px;
    gap: 12px;
    max-width: 700px;
  }

  /* 服务状态卡 */
  .st-card { padding: 16px; }
  .st-title { font-size: 14px; font-weight: 700; color: #48484a; margin-bottom: 18px; letter-spacing: 0.02em; }
  .st-list { display: flex; flex-direction: column; gap: 11px; }
  .st-item { display: flex; align-items: center; justify-content: space-between; font-size: 13px; }
  .st-left { display: flex; align-items: center; gap: 7px; color: #86868b; font-weight: 500; }
  .st-val { font-weight: 600; color: #1d1d1f; font-size: 13px; }

  /* CPU+内存叠放 */
  .hw-mid { display: flex; flex-direction: column; gap: 10px; }
  .hw-card {
    padding: 14px 16px;
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(20px);
    border: 0.5px solid rgba(255,255,255,0.7);
    border-radius: 12px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.03);
  }
  .hw-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .hw-left { display: flex; align-items: center; gap: 6px; }
  .hw-dot { width: 5px; height: 5px; border-radius: 50%; }
  .hw-name { font-size: 13px; font-weight: 600; color: #86868b; }
  .hw-right { display: flex; align-items: baseline; gap: 2px; }
  .hw-val { font-size: 17px; font-weight: 800; letter-spacing: -0.03em; }
  .hw-unit { font-size: 11px; font-weight: 600; opacity: 0.5; }
  .hw-chart { width: 100%; height: 36px; }

  /* 硬盘饼图卡 */
  .disk-card {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 16px;
  }
  .pie-wrap { position: relative; width: 110px; height: 110px; }
  .pie-center {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%); text-align: center;
  }
  .pie-val { font-size: 20px; font-weight: 800; letter-spacing: -0.03em; color: #1d1d1f; }
  .pie-unit { font-size: 11px; color: #86868b; font-weight: 500; }
  .pie-label { margin-top: 10px; text-align: center; }
  .pie-name { font-size: 13px; font-weight: 600; color: #48484a; }
  .pie-detail { font-size: 11px; color: #aeaeb2; margin-top: 2px; font-weight: 500; }

  /* ===== 方案 B: 不同比例 ===== */
  .hw4-grid {
    display: grid;
    grid-template-columns: 160px 1fr 200px;
    gap: 12px;
    max-width: 740px;
  }
  .disk2-card {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 16px;
  }
  .pie2-wrap { position: relative; width: 120px; height: 120px; }
  .pie2-center {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%); text-align: center;
  }
  .pie2-val { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; color: #1d1d1f; }
  .pie2-unit { font-size: 9px; color: #86868b; font-weight: 500; }
  .pie2-legend { margin-top: 12px; width: 100%; display: flex; flex-direction: column; gap: 5px; }
  .pie2-legend-item { display: flex; align-items: center; justify-content: space-between; font-size: 10px; }
  .pie2-legend-left { display: flex; align-items: center; gap: 5px; }
  .pie2-legend-dot { width: 6px; height: 6px; border-radius: 2px; }
  .pie2-legend-label { color: #86868b; font-weight: 500; }
  .pie2-legend-val { font-weight: 700; color: #1d1d1f; }
</style>
</head>
<body>

<!-- 方案 A: 紧凑三栏 -->
<div class="section">
  <div class="section-label">方案 A</div>
  <div class="section-title">服务状态 | CPU+内存折线 | 硬盘环形图</div>
  <div class="section-desc">紧凑三栏：左侧服务状态，中间 CPU/内存叠放折线，右侧硬盘饼图</div>

  <div class="hw3-grid">
    <!-- 服务状态 -->
    <div class="glass st-card">
      <div class="st-title">服务状态</div>
      <div class="st-list">
        <div class="st-item">
          <div class="st-left"><span class="status-dot online"></span> Logto</div>
          <div class="st-val" style="color:#34C759">在线</div>
        </div>
        <div class="st-item">
          <div class="st-left"><span class="status-dot online"></span> 数据库</div>
          <div class="st-val" style="color:#34C759">正常</div>
        </div>
        <div class="st-item">
          <div class="st-left"><span class="status-dot online"></span> 缓存</div>
          <div class="st-val" style="color:#34C759">正常</div>
        </div>
        <div class="st-item">
          <div class="st-left">运行</div>
          <div class="st-val">45天12时</div>
        </div>
      </div>
    </div>

    <!-- CPU + 内存 -->
    <div class="hw-mid">
      <div class="hw-card">
        <div class="hw-head">
          <div class="hw-left">
            <div class="hw-dot" style="background:#6366f1"></div>
            <span class="hw-name">CPU</span>
          </div>
          <div class="hw-right">
            <span class="hw-val" style="color:#6366f1">45</span>
            <span class="hw-unit" style="color:#6366f1">%</span>
          </div>
        </div>
        <div class="hw-chart">
          <svg viewBox="0 0 240 36" preserveAspectRatio="none" style="width:100%;height:100%">
            <defs>
              <linearGradient id="cpuF" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18"/>
                <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
              </linearGradient>
            </defs>
            <path d="M0 22 C12 19, 24 14, 36 16 C48 18, 56 10, 72 12 C88 14, 100 8, 120 10 C140 12, 148 18, 168 14 C188 10, 200 14, 216 12 C228 11, 234 14, 240 16 L240 36 L0 36 Z" fill="url(#cpuF)"/>
            <path d="M0 22 C12 19, 24 14, 36 16 C48 18, 56 10, 72 12 C88 14, 100 8, 120 10 C140 12, 148 18, 168 14 C188 10, 200 14, 216 12 C228 11, 234 14, 240 16" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="240" cy="16" r="2.5" fill="#6366f1" stroke="white" stroke-width="1.5"/>
          </svg>
        </div>
      </div>
      <div class="hw-card">
        <div class="hw-head">
          <div class="hw-left">
            <div class="hw-dot" style="background:#8b5cf6"></div>
            <span class="hw-name">内存</span>
          </div>
          <div class="hw-right">
            <span class="hw-val" style="color:#8b5cf6">62</span>
            <span class="hw-unit" style="color:#8b5cf6">%</span>
          </div>
        </div>
        <div class="hw-chart">
          <svg viewBox="0 0 240 36" preserveAspectRatio="none" style="width:100%;height:100%">
            <defs>
              <linearGradient id="memF" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.18"/>
                <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
              </linearGradient>
            </defs>
            <path d="M0 14 C12 12, 24 10, 36 11 C48 12, 60 8, 72 9 C84 10, 96 6, 120 8 C144 10, 156 12, 168 10 C180 8, 192 10, 216 8 C228 7, 234 9, 240 10 L240 36 L0 36 Z" fill="url(#memF)"/>
            <path d="M0 14 C12 12, 24 10, 36 11 C48 12, 60 8, 72 9 C84 10, 96 6, 120 8 C144 10, 156 12, 168 10 C180 8, 192 10, 216 8 C228 7, 234 9, 240 10" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="240" cy="10" r="2.5" fill="#8b5cf6" stroke="white" stroke-width="1.5"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- 硬盘 -->
    <div class="glass disk-card">
      <div class="pie-wrap">
        <svg viewBox="0 0 110 110" style="width:100%;height:100%">
          <defs>
            <linearGradient id="dG" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#14b8a6"/>
              <stop offset="100%" stop-color="#06b6d4"/>
            </linearGradient>
          </defs>
          <circle cx="55" cy="55" r="42" fill="none" stroke="rgba(0,0,0,0.04)" stroke-width="9"/>
          <circle cx="55" cy="55" r="42" fill="none" stroke="url(#dG)" stroke-width="9" stroke-linecap="round"
            stroke-dasharray="100.27 263.89"
            transform="rotate(-90 55 55)"/>
        </svg>
        <div class="pie-center">
          <div class="pie-val">38%</div>
          <div class="pie-unit">已使用</div>
        </div>
      </div>
      <div class="pie-label">
        <div class="pie-name">硬盘</div>
        <div class="pie-detail">190 / 500 GB</div>
      </div>
    </div>
  </div>

  <div class="vote"><button class="vb" onclick="vote(this)">👍</button><button class="vb" onclick="novote(this)">👎</button></div>
</div>

<!-- 方案 B: 饼图带图例 -->
<div class="section">
  <div class="section-label">方案 B</div>
  <div class="section-title">同上 + 饼图带详细图例</div>
  <div class="section-desc">服务状态+折线不变，硬盘环形图更大并带使用/可用/总计图例</div>

  <div class="hw4-grid">
    <!-- 服务状态 -->
    <div class="glass st-card">
      <div class="st-title">服务状态</div>
      <div class="st-list">
        <div class="st-item">
          <div class="st-left"><span class="status-dot online"></span> Logto</div>
          <div class="st-val" style="color:#34C759">在线</div>
        </div>
        <div class="st-item">
          <div class="st-left"><span class="status-dot online"></span> 数据库</div>
          <div class="st-val" style="color:#34C759">正常</div>
        </div>
        <div class="st-item">
          <div class="st-left"><span class="status-dot online"></span> 缓存</div>
          <div class="st-val" style="color:#34C759">正常</div>
        </div>
        <div class="st-item">
          <div class="st-left">运行</div>
          <div class="st-val">45天12时</div>
        </div>
      </div>
    </div>

    <!-- CPU + 内存 -->
    <div class="hw-mid">
      <div class="hw-card">
        <div class="hw-head">
          <div class="hw-left">
            <div class="hw-dot" style="background:#6366f1"></div>
            <span class="hw-name">CPU</span>
          </div>
          <div class="hw-right">
            <span class="hw-val" style="color:#6366f1">45</span>
            <span class="hw-unit" style="color:#6366f1">%</span>
          </div>
        </div>
        <div class="hw-chart">
          <svg viewBox="0 0 240 36" preserveAspectRatio="none" style="width:100%;height:100%">
            <defs>
              <linearGradient id="cpuF2" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18"/>
                <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
              </linearGradient>
            </defs>
            <path d="M0 22 C12 19, 24 14, 36 16 C48 18, 56 10, 72 12 C88 14, 100 8, 120 10 C140 12, 148 18, 168 14 C188 10, 200 14, 216 12 C228 11, 234 14, 240 16 L240 36 L0 36 Z" fill="url(#cpuF2)"/>
            <path d="M0 22 C12 19, 24 14, 36 16 C48 18, 56 10, 72 12 C88 14, 100 8, 120 10 C140 12, 148 18, 168 14 C188 10, 200 14, 216 12 C228 11, 234 14, 240 16" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="240" cy="16" r="2.5" fill="#6366f1" stroke="white" stroke-width="1.5"/>
          </svg>
        </div>
      </div>
      <div class="hw-card">
        <div class="hw-head">
          <div class="hw-left">
            <div class="hw-dot" style="background:#8b5cf6"></div>
            <span class="hw-name">内存</span>
          </div>
          <div class="hw-right">
            <span class="hw-val" style="color:#8b5cf6">62</span>
            <span class="hw-unit" style="color:#8b5cf6">%</span>
          </div>
        </div>
        <div class="hw-chart">
          <svg viewBox="0 0 240 36" preserveAspectRatio="none" style="width:100%;height:100%">
            <defs>
              <linearGradient id="memF2" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.18"/>
                <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
              </linearGradient>
            </defs>
            <path d="M0 14 C12 12, 24 10, 36 11 C48 12, 60 8, 72 9 C84 10, 96 6, 120 8 C144 10, 156 12, 168 10 C180 8, 192 10, 216 8 C228 7, 234 9, 240 10 L240 36 L0 36 Z" fill="url(#memF2)"/>
            <path d="M0 14 C12 12, 24 10, 36 11 C48 12, 60 8, 72 9 C84 10, 96 6, 120 8 C144 10, 156 12, 168 10 C180 8, 192 10, 216 8 C228 7, 234 9, 240 10" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="240" cy="10" r="2.5" fill="#8b5cf6" stroke="white" stroke-width="1.5"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- 硬盘 -->
    <div class="glass disk2-card">
      <div class="pie2-wrap">
        <svg viewBox="0 0 120 120" style="width:100%;height:100%">
          <defs>
            <linearGradient id="dG2" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#14b8a6"/>
              <stop offset="100%" stop-color="#06b6d4"/>
            </linearGradient>
          </defs>
          <circle cx="60" cy="60" r="46" fill="none" stroke="rgba(0,0,0,0.04)" stroke-width="10"/>
          <circle cx="60" cy="60" r="46" fill="none" stroke="url(#dG2)" stroke-width="10" stroke-linecap="round"
            stroke-dasharray="109.83 289.03"
            transform="rotate(-90 60 60)"/>
        </svg>
        <div class="pie2-center">
          <div class="pie2-val">38%</div>
          <div class="pie2-unit">已使用</div>
        </div>
      </div>
      <div class="pie2-legend">
        <div class="pie2-legend-item">
          <div class="pie2-legend-left">
            <div class="pie2-legend-dot" style="background:linear-gradient(135deg,#14b8a6,#06b6d4)"></div>
            <span class="pie2-legend-label">已使用</span>
          </div>
          <span class="pie2-legend-val">190 GB</span>
        </div>
        <div class="pie2-legend-item">
          <div class="pie2-legend-left">
            <div class="pie2-legend-dot" style="background:rgba(0,0,0,0.06)"></div>
            <span class="pie2-legend-label">可用</span>
          </div>
          <span class="pie2-legend-val">310 GB</span>
        </div>
        <div class="pie2-legend-item">
          <div class="pie2-legend-left">
            <div class="pie2-legend-dot" style="background:#48484a"></div>
            <span class="pie2-legend-label">总计</span>
          </div>
          <span class="pie2-legend-val">500 GB</span>
        </div>
      </div>
    </div>
  </div>

  <div class="vote"><button class="vb" onclick="vote(this)">👍</button><button class="vb" onclick="novote(this)">👎</button></div>
</div>

<script>
function vote(b) { b.classList.add('lk'); b.nextElementSibling.classList.remove('nk'); }
function novote(b) { b.classList.add('nk'); b.previousElementSibling.classList.remove('lk'); }
</script>
</body>
</html>
